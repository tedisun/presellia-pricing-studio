name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create plugin ZIP
        run: |
          zip -r presellia-pricing-studio.zip . \
            --exclude "*.git*" \
            --exclude ".github/*" \
            --exclude "*.DS_Store" \
            --exclude "*.gitignore"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: presellia-pricing-studio.zip
          generate_release_notes: true
